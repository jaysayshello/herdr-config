onboarding = false

[keys]
prefix = "ctrl+space"

# Mirrors ~/.tmux.conf. Herdr runs in its own terminal window, not inside tmux,
# so the direct chords below are free to take the same keys tmux uses.
reload_config    = "prefix+r"
resize_mode      = "prefix+shift+r"
focus_pane_left  = ["prefix+h", "ctrl+a"]
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = ["prefix+l", "ctrl+d"]
split_vertical   = ["prefix+v", "ctrl+e"]
split_horizontal = ["prefix+minus", "ctrl+q"]
close_pane       = ["prefix+x", "alt+w"]
zoom             = "prefix+z"
swap_pane_left   = "alt+h"
swap_pane_right  = "alt+l"
switch_workspace = "alt+1..9"
previous_workspace = "ctrl+w"
next_workspace     = "ctrl+s"
new_workspace      = ["prefix+shift+n", "ctrl+n"]

[[keys.command]]
key = "ctrl+r"
type = "shell"
command = "~/.config/herdr/scripts/balance-panes.sh"
description = "balance panes evenly"

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "~/.config/herdr/scripts/swap-or-vim.sh left ctrl+h"
description = "swap pane left (vim gets the key)"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "~/.config/herdr/scripts/swap-or-vim.sh down ctrl+j"
description = "swap pane down (vim gets the key)"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "~/.config/herdr/scripts/swap-or-vim.sh up ctrl+k"
description = "swap pane up (vim gets the key)"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "~/.config/herdr/scripts/swap-or-vim.sh right ctrl+l"
description = "swap pane right (vim gets the key)"

[ui]
agent_panel_scope = "all"

agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
sidebar_width = 56
sidebar_max_width = 56
[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"

[experimental]
pane_history = false
